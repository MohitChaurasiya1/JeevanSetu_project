version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jeevansetu_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeevansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-jeevansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeevansetu_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeevansetu_user} -d ${POSTGRES_DB:-jeevansetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeevansetu_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jeevansetu_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
